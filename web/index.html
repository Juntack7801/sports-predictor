<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>배트 서포터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #ff5a3c;
    --accent-glow: rgba(255,90,60,0.35);
    --ink: #12131a;
    --ink-soft: #5b5f6b;
    --ink-faint: #9498a3;
    --line: #e7e8ec;
    --bg: #eef0f4;
    --card: #ffffff;
    --red: #e0433d;
    --red-bg: #ffe4e0;
    --red-deep: #c22a1f;
    --amber: #b8790a;
    --amber-bg: #fff0d4;
    --amber-deep: #8a5c06;
    --gray-bg: #eef0f4;
    --green: #1c8f4c;
    --green-bg: #dff5e6;
  }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== header ===== */
  .top-bar {
    background: linear-gradient(135deg, #14161f 0%, #1f2230 100%);
    color: white;
    padding: 26px 4vw 22px;
  }
  .top-bar-inner { max-width: 1400px; margin: 0 auto; }
  .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .brand-mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 20px; font-weight: 900;
    box-shadow: 0 0 20px var(--accent-glow);
  }
  h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
  .subtitle { font-size: 13px; color: #9497a8; font-weight: 600; margin-top: 2px; }
  .disclaimer {
    font-size: 11px;
    color: #71748a;
    line-height: 1.5;
    margin-top: 12px;
  }

  /* ===== controls ===== */
  .control-bar { max-width: 1400px; margin: 0 auto; padding: 16px 4vw 0; }

  .segmented {
    display: inline-flex;
    background: var(--gray-bg);
    border-radius: 12px;
    padding: 3px;
    gap: 2px;
    margin-bottom: 12px;
  }
  .segmented button {
    border: none;
    background: transparent;
    padding: 9px 18px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .segmented button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(20,22,28,0.1); }

  .row2 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
  .league-tabs { display: flex; gap: 6px; }
  .league-tab {
    border: 1px solid var(--line);
    background: var(--card);
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .league-tab.active { background: var(--ink); border-color: var(--ink); color: white; }
  .refresh-btn {
    font-size: 12.5px; font-weight: 700; padding: 7px 14px;
    border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; color: var(--ink-soft);
  }

  .legend { display: flex; gap: 16px; font-size: 11.5px; color: var(--ink-faint); margin-bottom: 4px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 5px; font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ===== content grid ===== */
  .content { max-width: 1400px; margin: 0 auto; padding: 4px 4vw 60px; }

  .game-date {
    font-size: 13px; font-weight: 900; color: var(--ink-soft);
    margin: 22px 2px 12px; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* ===== card ===== */
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
    border: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .card.tier-극추천 {
    background: linear-gradient(160deg, #fff 0%, var(--red-bg) 130%);
    border: 1.5px solid #f5b3ac;
    box-shadow: 0 4px 18px rgba(224,67,61,0.16);
  }
  .card.tier-추천 {
    background: linear-gradient(160deg, #fff 0%, var(--amber-bg) 130%);
    border: 1.5px solid #f0cf8f;
    box-shadow: 0 4px 14px rgba(184,121,10,0.12);
  }
  .card.result-correct { border-color: #9fdcb6; }

  .stripe {
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
  }
  .tier-극추천 .stripe { background: linear-gradient(90deg, var(--red), #ff8a6b); }
  .tier-추천 .stripe { background: linear-gradient(90deg, var(--amber), #f0b649); }
  .tier-관망 .stripe { background: var(--line); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; margin-top: 4px; }

  .matchup-title { font-size: 21px; font-weight: 900; letter-spacing: -0.4px; color: var(--ink); line-height: 1.25; }
  .matchup-title .vs { color: var(--ink-faint); font-weight: 700; font-size: 15px; margin: 0 4px; }
  .score-line { font-size: 15px; font-weight: 800; color: var(--ink-soft); margin-top: 2px; }

  .badge {
    font-size: 11px; font-weight: 900; padding: 6px 13px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0; margin-left: 10px;
  }
  .badge-극추천 { background: var(--red-deep); color: white; }
  .badge-추천 { background: var(--amber-deep); color: white; }
  .badge-관망 { background: var(--gray-bg); color: var(--ink-faint); }
  .badge-correct { background: var(--green); color: white; }
  .badge-wrong { background: var(--gray-bg); color: var(--ink-faint); }

  .meta-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-bottom: 10px; }
  .game-time { font-weight: 800; color: var(--ink); }

  .detail-line { font-size: 11px; color: var(--ink-faint); margin: 0 0 12px; line-height: 1.6; }

  .analysis-box {
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; margin: 0 0 12px;
    font-size: 12px; color: var(--ink-soft); line-height: 1.6;
  }
  .analysis-box b { color: var(--ink); }

  .divider { height: 1px; background: rgba(0,0,0,0.06); margin: 0 0 12px; }

  .prob-section { margin-bottom: 10px; }
  .prob-label-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .prob-label-row .lead { color: var(--ink); }
  .prob-bar-track { height: 9px; border-radius: 5px; background: rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 6px; }
  .prob-bar-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .prob-value { font-size: 13px; color: var(--ink-faint); font-weight: 600; }
  .prob-value b { color: var(--ink); font-size: 16px; font-weight: 900; }

  .ou-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.035); border-radius: 10px; padding: 12px 14px; margin-top: 10px;
  }
  .ou-label { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .ou-value { font-size: 16px; font-weight: 900; color: var(--ink); }
  .source-tag { font-size: 9.5px; font-weight: 900; padding: 2px 7px; border-radius: 6px; margin-left: 6px; background: var(--green-bg); color: var(--green); }
  .source-tag.source-self { background: rgba(0,0,0,0.06); color: var(--ink-faint); }

  .card-footer { font-size: 10.5px; color: var(--ink-faint); margin-top: 12px; text-align: right; font-weight: 600; }

  .empty, .loading { text-align: center; color: var(--ink-faint); padding: 80px 20px; font-size: 13.5px; line-height: 1.6; }
  .updated { text-align: center; font-size: 11px; color: var(--ink-faint); margin-top: 24px; }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-inner">
      <div class="brand-row">
        <div class="brand-mark">B</div>
        <div>
          <h1>배트 서포터</h1>
          <p class="subtitle">통계 기반 경기 예측 도우미</p>
        </div>
      </div>
      <p class="disclaimer">베팅 프로그램이 아닙니다. 실제 결과를 보장하지 않는 참고용 통계 정보입니다.</p>
    </div>
  </div>

  <div class="control-bar">
    <div class="segmented" id="date-tabs"></div>
    <div class="row2">
      <div class="league-tabs" id="league-tabs"></div>
      <button class="refresh-btn" id="refresh-btn">↻ 새로고침</button>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#e0433d"></span>극추천 80%+</span>
      <span><span class="dot" style="background:#b8790a"></span>추천 60~80%</span>
      <span><span class="dot" style="background:#9498a3"></span>관망 60%↓</span>
    </div>
  </div>

  <div class="content">
    <div id="games-container">
      <div class="loading">불러오는 중...</div>
    </div>
    <div class="updated" id="updated-at"></div>
  </div>

<script>
  const API_BASE = "http://localhost:8000";

  const container = document.getElementById("games-container");
  const dateTabsEl = document.getElementById("date-tabs");
  const leagueTabsEl = document.getElementById("league-tabs");
  const updatedAt = document.getElementById("updated-at");
  const refreshBtn = document.getElementById("refresh-btn");

  const LEAGUES = ["MLB", "KBO", "NPB"];

  function fmt(value, suffix) {
    return (value === null || value === undefined) ? "정보 없음" : `${value}${suffix || ""}`;
  }

  function toISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  const dateOptions = [0, -1, -2].map(offset => {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    const label = offset === 0 ? "오늘" : offset === -1 ? "어제" : "그저께";
    return { iso: toISO(d), label: `${label} ${d.getMonth() + 1}/${d.getDate()}` };
  });

  let selectedDate = dateOptions[0].iso;
  let selectedLeague = "MLB";

  function renderTabs() {
    dateTabsEl.innerHTML = dateOptions.map(opt => `
      <button class="${opt.iso === selectedDate ? 'active' : ''}" data-date="${opt.iso}">${opt.label}</button>
    `).join("");
    dateTabsEl.querySelectorAll("button").forEach(el => {
      el.addEventListener("click", () => { selectedDate = el.dataset.date; renderTabs(); loadGames(); });
    });

    leagueTabsEl.innerHTML = LEAGUES.map(lg => `
      <button class="league-tab ${lg === selectedLeague ? 'active' : ''}" data-league="${lg}">${lg}</button>
    `).join("");
    leagueTabsEl.querySelectorAll("button").forEach(el => {
      el.addEventListener("click", () => { selectedLeague = el.dataset.league; renderTabs(); loadGames(); });
    });
  }

  function formatDateKr(isoDate) {
    if (!isoDate) return "";
    const [y, m, d] = isoDate.split("-");
    return `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
  }

  function formatGameTime(dt) {
    if (!dt) return null;
    // MLB: ISO8601 UTC ("...T23:05:00Z") / KBO: "YYYY-MM-DD HH:MM:00" 로컬
    if (dt.includes("T")) {
      const d = new Date(dt);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }
    const parts = dt.split(" ");
    return parts.length > 1 ? parts[1].slice(0, 5) : null;
  }

  function formatUpdatedKr(timestamp) {
    if (!timestamp) return null;
    const datePart = timestamp.split(" ")[0];
    const [y, m, d] = datePart.split("-");
    return `${parseInt(m)}월 ${parseInt(d)}일 계산됨`;
  }

  function renderGames(data) {
    if (data.error) {
      container.innerHTML = `<div class="empty">오류가 발생했습니다.<br><span style="font-size:11.5px;color:#e0433d">${data.error}</span><br><br>이 메시지를 그대로 캡처해서 알려주세요.</div>`;
      return;
    }

    if (!data.games || data.games.length === 0) {
      container.innerHTML = `<div class="empty"><b>${formatDateKr(data.date)}</b> 경기 기록이 없습니다.<br>수집기를 아직 안 돌렸거나, 예정된 경기가 없는 날일 수 있어요.</div>`;
      return;
    }

    // 시간순 정렬은 API에서 이미 해주지만, 혹시 시간 정보가 없는 경기가 섞여도
    // 순서가 깨지지 않도록 그대로 서버가 준 순서를 유지한다.
    const games = data.games;
    const dateHeader = `<div class="game-date">${formatDateKr(data.date)}</div>`;

    const cards = games.map(g => {
      const tier = g.tier || "관망";
      const isFinished = g.home_score != null && g.away_score != null;

      const winProbHome = g.win_prob_home != null ? Math.round(g.win_prob_home * 100) : null;
      const winProbAway = g.win_prob_away != null ? Math.round(g.win_prob_away * 100) : null;
      const overProb = g.over_prob != null ? Math.round(g.over_prob * 100) : null;
      const underProb = g.under_prob != null ? Math.round(g.under_prob * 100) : null;

      const homeShort = g.home_name_short || g.home_name_kr;
      const awayShort = g.away_name_short || g.away_name_kr;

      let probSection;
      if (winProbHome != null) {
        const favoredHome = winProbHome >= winProbAway;
        const leadName = favoredHome ? homeShort : awayShort;
        const leadPct = favoredHome ? winProbHome : winProbAway;
        const otherName = favoredHome ? awayShort : homeShort;
        const otherPct = favoredHome ? winProbAway : winProbHome;
        probSection = `
          <div class="prob-section">
            <div class="prob-label-row"><span class="lead">${leadName}</span><span>${otherName}</span></div>
            <div class="prob-bar-track"><div class="prob-bar-fill" style="width:${leadPct}%"></div></div>
            <div class="prob-value"><b>${leadPct}%</b> 승리 예측 <span style="opacity:0.6">· ${otherName} ${otherPct}%</span></div>
          </div>`;
      } else {
        probSection = `<div class="prob-section"><div class="prob-value" style="color:var(--ink-faint)">승리 확률 계산 전</div></div>`;
      }

      let ouSection = "";
      if (g.ou_line != null) {
        const isBetman = g.ou_line_source === "betman";
        const ouResult = `${(overProb ?? 0) >= (underProb ?? 0) ? "오버" : "언더"} ${Math.max(overProb ?? 0, underProb ?? 0)}%`;
        const tag = isBetman
          ? '<span class="source-tag">배트맨 실배당</span>'
          : '<span class="source-tag source-self">자체 추정</span>';
        ouSection = `
          <div class="ou-row">
            <span class="ou-label">오버/언더 ${g.ou_line}${tag}</span>
            <span class="ou-value">${ouResult}</span>
          </div>`;
      }

      const homePitcherLine = `${g.home_pitcher || '선발 미정'} (ERA ${fmt(g.home_pitcher_era)})`;
      const awayPitcherLine = `${g.away_pitcher || '선발 미정'} (ERA ${fmt(g.away_pitcher_era)})`;

      const updatedText = formatUpdatedKr(g.predicted_at);
      const gameTime = formatGameTime(g.game_datetime_utc);

      let topBadge = `<span class="badge badge-${tier}">${tier}</span>`;
      let cardResultClass = "";
      if (isFinished) {
        if (g.winner_correct === 1) { topBadge = '<span class="badge badge-correct">승패 적중</span>'; cardResultClass = " result-correct"; }
        else if (g.winner_correct === 0) topBadge = '<span class="badge badge-wrong">승패 실패</span>';
      }

      const analysisBox = (isFinished && g.analysis_note)
        ? `<div class="analysis-box"><b>왜 이런 결과가 나왔을까요?</b><br>${g.analysis_note}</div>`
        : "";

      const titleLine = isFinished
        ? `<div class="matchup-title">${awayShort}<span class="vs">vs</span>${homeShort}</div>
           <div class="score-line">${g.away_score} : ${g.home_score}</div>`
        : `<div class="matchup-title">${awayShort}<span class="vs">vs</span>${homeShort}</div>`;

      return `
        <div class="card tier-${tier}${cardResultClass}">
          <div class="stripe"></div>
          <div class="card-top">
            ${titleLine}
            ${topBadge}
          </div>
          <div class="meta-row">
            <span>${g.venue_name || ''}</span>
            ${gameTime ? `<span class="game-time">${gameTime}</span>` : ""}
          </div>
          <p class="detail-line">${awayPitcherLine}<br>${homePitcherLine}</p>
          ${analysisBox}
          <div class="divider"></div>
          ${probSection}
          ${ouSection}
          ${updatedText ? `<div class="card-footer">${updatedText}</div>` : ""}
        </div>
      `;
    }).join("");

    container.innerHTML = dateHeader + `<div class="grid">${cards}</div>`;
  }

  async function loadGames() {
    container.innerHTML = '<div class="loading">불러오는 중...</div>';
    try {
      const res = await fetch(`${API_BASE}/api/today?league=${selectedLeague}&date=${selectedDate}`);
      const data = await res.json();
      renderGames(data);
      updatedAt.textContent = "화면 새로고침: " + new Date().toLocaleTimeString("ko-KR");
    } catch (err) {
      container.innerHTML = `<div class="empty">API 서버(${API_BASE})에 연결하지 못했습니다.<br>run_app.bat을 실행했는지, 검은 창이 열려 있는지 확인해주세요.<br><br><span style="font-size:11px;color:#e0433d">${err}</span></div>`;
    }
  }

  renderTabs();
  refreshBtn.addEventListener("click", loadGames);
  loadGames();
</script>

</body>
</html>
